<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3E47" />
      <stop offset="100%" stop-color="#132A30" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Grid Pattern Accent -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="2">
    <line x1="96" y1="0" x2="96" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="288" y1="0" x2="288" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="0" y1="96" x2="512" y2="96" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="288" x2="512" y2="288" />
    <line x1="0" y1="384" x2="512" y2="384" />
  </g>

  <!-- Molecular Structure -->
  <g filter="url(#glow)">
    <!-- Hexagonal Ring Bonds (Center ~ (230, 260)) -->
    <!-- Vertices:
         v1: (230, 150)
         v2: (320, 202)
         v3: (320, 306)
         v4: (230, 358)
         v5: (140, 306)
         v6: (140, 202)
    -->
    <!-- Outer hexagon lines -->
    <g stroke="#C7D2CB" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <line x1="230" y1="150" x2="320" y2="202" />
      <line x1="320" y1="202" x2="320" y2="306" />
      <line x1="320" y1="306" x2="230" y2="358" />
      <line x1="230" y1="358" x2="140" y2="306" />
      <line x1="140" y1="306" x2="140" y2="202" />
      <line x1="140" y1="202" x2="230" y2="150" />

      <!-- Substituent branch to coral atom: from (320, 202) to (395, 158) -->
      <line x1="320" y1="202" x2="395" y2="158" />

      <!-- Substituent double bond (carbonyl-like): from (230, 358) to (230, 440) -->
      <line x1="222" y1="358" x2="222" y2="440" />
      <line x1="238" y1="358" x2="238" y2="440" />

      <!-- Substituent branch to teal atom: from (140, 202) to (75, 164) -->
      <line x1="140" y1="202" x2="75" y2="164" />
    </g>

    <!-- Inner aromatic double bonds -->
    <g stroke="#6FB8B0" stroke-width="8" stroke-linecap="round">
      <line x1="230" y1="172" x2="304" y2="215" />
      <line x1="304" y1="297" x2="230" y2="339" />
      <line x1="156" y1="297" x2="156" y2="211" />
    </g>

    <!-- Ring Vertices (Atoms) -->
    <circle cx="230" cy="150" r="14" fill="#FCFCFA" />
    <circle cx="320" cy="202" r="14" fill="#FCFCFA" />
    <circle cx="320" cy="306" r="14" fill="#FCFCFA" />
    <circle cx="230" cy="358" r="14" fill="#FCFCFA" />
    <circle cx="140" cy="306" r="14" fill="#FCFCFA" />
    <circle cx="140" cy="202" r="14" fill="#FCFCFA" />

    <!-- External Functional Group Atoms -->
    <!-- Coral group (e.g. oxygen / ketone / active site) -->
    <circle cx="395" cy="158" r="22" fill="#D8532B" />
    <circle cx="230" cy="440" r="20" fill="#D8532B" />

    <!-- Teal group -->
    <circle cx="75" cy="164" r="18" fill="#6FB8B0" />
  </g>
</svg>
